<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Ice Age Baby Adventure</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>

    <style>
      canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        display: block !important;
        border: 0 none !important;
        image-rendering: pixelated;
      }

      /* Remove layout constraints */
      .webgl-content, #unityContainer {
        width: 100% !important;
        height: 100% !important;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }
    </style>

    <script>
      var unityInstance = UnityLoader.instantiate(
        "unityContainer",
        "Build/Kill the Ice Age Baby Adventure The Game.json",
        { onProgress: UnityProgress }
      );

      // Set canvas resolution ONCE after it appears
      function fixCanvasSize() {
        var canvas = document.querySelector("canvas");
        if (!canvas) {
          requestAnimationFrame(fixCanvasSize);
          return;
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("load", fixCanvasSize);
    </script>
  </head>

  <body>
    <div class="webgl-content">
      <div id="unityContainer"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="unityInstance.SetFullscreen(1)"></div>
        <div class="title">Ice Age Baby Adventure</div>
      </div>
    </div>
  </body>
</html>
